# Build both driver variants and attach them to a GitHub Release, so the
# driver is usable without Nix: the artifacts are plain UEFI PE binaries
# that drop onto an EFI System Partition.
#
# Triggered by pushing a tag like v0.1.0, or by hand from the Actions tab
# against any ref (workflow_dispatch), which builds and uploads the
# artifacts to the run without creating a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Actions pinned by commit, as in check.yml: what this job produces
    # is loaded into firmware, so the pipeline that produces it must not
    # change under a moving tag.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # Substitute from the clhodapp cache, where main's check run pushed
      # both variants, so a tag build downloads the very store paths a
      # Nix user at the same pins gets rather than compiling again. A
      # public cache needs no credentials to read; nothing is pushed
      # from here.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      # The systemd-boot drop-in path requires the x64.efi suffix, so the
      # release artifacts are named the way they are meant to be installed.
      - name: Build both variants
        run: |
          mkdir -p artifacts
          nix build -L '.#big-console-dxe' -o result-1x
          nix build -L '.#big-console-dxe-2x' -o result-2x
          install -m0644 result-1x/BigGraphicsConsoleDxe.efi \
            artifacts/bigconsolex64.efi
          install -m0644 result-2x/BigGraphicsConsoleDxe.efi \
            artifacts/bigconsole2xx64.efi

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.efi > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: big-console-efi
          path: artifacts/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes-preamble.md \
            artifacts/bigconsolex64.efi \
            artifacts/bigconsole2xx64.efi \
            artifacts/SHA256SUMS
